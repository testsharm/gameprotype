<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>TerraForm 3D</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2318212f'/%3E%3Cpath d='M6 22h14l4-8h-8l-2-5H8z' fill='%23fbbf24'/%3E%3C/svg%3E">
<script data-crazygames-sdk="1" src="https://sdk.crazygames.com/crazygames-sdk-v3.js"></script>
<style id="tf-tokens">
/* ============================================================
   ONE place for every look token. Every var used by the HUD,
   menus and windows is defined here. Run scripts/contrast-check.mjs
   and scripts/token-check.mjs to prove it.
   ============================================================ */
:root{
  --panel:        linear-gradient(180deg,#34445f,#151d2b);
  --panel-solid:  #1d2839;
  --steel:        linear-gradient(180deg,#3b4d6b,#1c2638);
  --steel-flat:   #151d2b;
  --well:         #0b111a;
  --ink:          #f1f5f9;
  --muted:        #cbd5e1;
  --amber:        linear-gradient(180deg,#fde68a,#f59e0b);
  --amber-flat:   #fbbf24;
  --amber-dark:   #b45309;
  --green:        linear-gradient(180deg,#a7f3d0,#34d399);
  --green-flat:   #34d399;
  --red:          linear-gradient(180deg,#b91c1c,#7f1d1d);
  --red-flat:     #ef4444;
  --cyan:         #22d3ee;
  --goal:         #fbbf24;
  --success:      #34d399;
  --danger:       #ef4444;
  --border:       #0a0f18;
  --radius:       14px;
  --shadow:       0 4px 0 #0a0f18;
  --font:         "Arial Black","Segoe UI Black",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --hazard:       repeating-linear-gradient(45deg,#fbbf24 0 6px,#1a1204 6px 12px);
}
/* Global reset FIRST. Without this, an unstyled <button> shows the browser's
   white "buttonface" background with white text = invisible buttons. */
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#0f141c;-webkit-tap-highlight-color:transparent;font-family:var(--font)}
#game-container{position:fixed;left:0;top:0;width:100vw;height:100vh;display:block}
/* loading screen */
#loading-screen{position:fixed;inset:0;z-index:900;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:radial-gradient(circle at 50% 40%,#2b384e,#0b111a);color:#e2e8f0;transition:opacity .4s}
#loading-screen.hidden{opacity:0;pointer-events:none;visibility:hidden}
#loading-screen .ld-logo{font-weight:900;font-size:44px;letter-spacing:.08em;color:var(--amber-flat);text-shadow:0 3px 0 #0a0f18,0 6px 0 var(--amber-dark)}
#loading-screen .ld-bar{width:240px;height:14px;border-radius:8px;background:var(--well);border:2px solid var(--border);box-shadow:inset 0 3px 5px rgba(0,0,0,.7);overflow:hidden}
#loading-screen .ld-bar i{display:block;height:100%;width:40%;border-radius:6px;background:var(--amber);animation:ldmove 1.1s ease-in-out infinite alternate}
#loading-screen .ld-txt{font-weight:700;font-size:16px;color:#9fb0c8}
@keyframes ldmove{from{margin-left:0}to{margin-left:60%}}
/* Hidden holder: the minimap canvas is moved into the HUD by GameUI.js. */
#tf-hold{display:none}
</style>
</head>
<body>
<canvas id="game-container"></canvas>

<div id="tf-hold">
  <canvas id="minimap-canvas" width="180" height="180"></canvas>
  <span id="coin-count">0</span>
</div>

<div id="loading-screen">
  <div class="ld-logo">TERRAFORM 3D</div>
  <div class="ld-bar"><i></i></div>
  <div class="ld-txt">Loading the site...</div>
</div>

<!-- Buttons must never keep focus: Space is the brake, not a click. -->
<script>
  document.addEventListener('mousedown', function (e) {
    if (e.target && e.target.closest && e.target.closest('button')) e.preventDefault();
  });
  document.addEventListener('click', function (e) {
    var b = e.target && e.target.closest ? e.target.closest('button') : null;
    if (b) setTimeout(function () { b.blur(); }, 0);
  }, true);
</script>
<script type="module" src="/src/main.js"></script>
</body>
</html>
