<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>TerraForm 3D</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2318212f'/%3E%3Cpath d='M6 22h14l4-8h-8l-2-5H8z' fill='%23fbbf24'/%3E%3C/svg%3E">
<script src="https://sdk.crazygames.com/crazygames-sdk-v3.js"></script>
<style>
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#0f141c;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#game-container{position:fixed;left:0;top:0;width:100vw;height:100vh;display:block}

/* loading screen */
#loading-screen{position:fixed;inset:0;z-index:900;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:radial-gradient(circle at 50% 40%,#2b384e,#0b111a);color:#e2e8f0;transition:opacity .4s}
#loading-screen.hidden{opacity:0;pointer-events:none;visibility:hidden}
#loading-screen .ld-logo{font-weight:900;font-size:44px;letter-spacing:.08em;color:#fbbf24;text-shadow:0 3px 0 #0a0f18,0 6px 0 #b45309}
#loading-screen .ld-bar{width:240px;height:14px;border-radius:8px;background:#0b111a;border:2px solid #0a0f18;box-shadow:inset 0 3px 5px rgba(0,0,0,.7);overflow:hidden}
#loading-screen .ld-bar i{display:block;height:100%;width:40%;border-radius:6px;background:linear-gradient(#fde68a,#f59e0b);animation:ldmove 1.1s ease-in-out infinite alternate}
#loading-screen .ld-txt{font-weight:700;font-size:16px;color:#9fb0c8}
@keyframes ldmove{from{margin-left:0}to{margin-left:60%}}

/* pause window */
#pause-overlay{position:fixed;inset:0;z-index:400;display:none;align-items:center;justify-content:center;background:rgba(6,10,16,.55);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
#pause-overlay.active{display:flex}
.ps-card{width:min(420px,92vw);border-radius:16px;overflow:hidden;color:#e2e8f0;background:linear-gradient(180deg,#34445f,#151d2b);border:2px solid #0a0f18;box-shadow:inset 0 1px 0 rgba(255,255,255,.14),0 6px 0 #0a0f18,0 18px 40px rgba(0,0,0,.55)}
.ps-head{padding:10px 18px;text-align:center;font-weight:900;font-size:24px;letter-spacing:.14em;color:#1a1204;text-shadow:none;background:repeating-linear-gradient(-45deg,#fbbf24 0 16px,#1a1204 16px 32px)}
.ps-head span{display:inline-block;padding:0 14px;background:#fbbf24;border-radius:6px}
.ps-body{padding:16px 18px 18px;display:flex;flex-direction:column;gap:12px}
.ps-btn{font:inherit;cursor:pointer;border-radius:12px;border:2px solid #0a0f18;color:#fff;font-weight:800;font-size:16px;height:48px;background:linear-gradient(#3a4c68,#1d2839);box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 5px 0 #0a0f18;outline:none;touch-action:manipulation}
.ps-btn:active{transform:translateY(3px);box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 2px 0 #0a0f18}
.ps-main{height:58px;font-size:20px;letter-spacing:.1em;color:#1a1204;background:linear-gradient(#fde68a,#f59e0b);box-shadow:inset 0 1px 0 rgba(255,255,255,.6),0 6px 0 #b45309,0 0 18px rgba(251,191,36,.4)}
.ps-main:active{box-shadow:inset 0 1px 0 rgba(255,255,255,.6),0 2px 0 #b45309}
.ps-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.ps-keys{display:grid;grid-template-columns:1fr 1fr;gap:8px 14px;padding:10px 14px;border-radius:10px;background:#0b111a;box-shadow:inset 0 3px 6px rgba(0,0,0,.7),0 1px 0 rgba(255,255,255,.12);font-weight:700;font-size:14px;color:#cbd5e1}
.ps-keys b{display:inline-block;min-width:26px;padding:2px 7px;margin-right:8px;text-align:center;border-radius:6px;color:#fbbf24;background:linear-gradient(#3a4c68,#1d2839);border:2px solid #0a0f18;box-shadow:0 2px 0 #0a0f18}
@media (max-height:420px){
  .ps-head{font-size:20px;padding:6px 14px}
  .ps-body{padding:10px 14px 12px;gap:8px}
  .ps-btn{height:42px}
  .ps-main{height:48px;font-size:18px}
  .ps-keys{padding:6px 12px;gap:4px 12px}
}
#tf-hold{display:none}
</style>
</head>
<body>
<canvas id="game-container"></canvas>

<div id="tf-hold">
  <canvas id="minimap-canvas" width="180" height="180"></canvas>
  <span id="coin-count">0</span>
</div>

<div id="pause-overlay">
  <div class="ps-card">
    <div class="ps-head"><span>PAUSED</span></div>
    <div class="ps-body">
      <button class="ps-btn ps-main" data-act="resume" tabindex="-1">RESUME</button>
      <div class="ps-grid">
        <button class="ps-btn" data-act="restart" tabindex="-1">Restart</button>
        <button class="ps-btn" data-act="contracts" tabindex="-1">Contracts</button>
        <button class="ps-btn" data-act="garage" tabindex="-1">Garage</button>
        <button class="ps-btn" data-act="resume2" tabindex="-1">Close</button>
      </div>
      <div class="ps-keys">
        <div><b>W A S D</b>Drive</div>
        <div><b>F</b>Scoop / dump</div>
        <div><b>C</b>Camera</div>
        <div><b>R</b>Restart</div>
        <div><b>M</b>Sound</div>
        <div><b>J</b> / <b>U</b>Menus</div>
      </div>
    </div>
  </div>
</div>

<div id="loading-screen">
  <div class="ld-logo">TERRAFORM 3D</div>
  <div class="ld-bar"><i></i></div>
  <div class="ld-txt">Loading the site...</div>
</div>

<script type="module" src="/src/main.js"></script>
</body>
</html>
